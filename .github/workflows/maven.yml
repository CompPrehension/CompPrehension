name: Java CI with Maven

on:
  pull_request:
    branches: [master, develop]
  workflow_call:
    inputs:
      sha:
        description: Commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
          lfs: 'true'
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: ${{ github.event_name != 'workflow_dispatch' && 'maven' || '' }}
      - name: Run the Maven verify phase
        run: ./mvnw -B verify --file pom.xml
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: modules/server

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}
          package-manager-cache: false
          cache-dependency-path: modules/server/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Build the frontend
        run: npm run build
