ctrlflow_text.trace.began.she=началась

ctrlflow_text.trace.ended=завершилось
ctrlflow_text.trace.ended.he=завершился
ctrlflow_text.trace.ended.she=завершилась

ctrlflow_text.trace.began_program=начала свое выполнение
ctrlflow_text.trace.ended_program=закончила свое выполнение

