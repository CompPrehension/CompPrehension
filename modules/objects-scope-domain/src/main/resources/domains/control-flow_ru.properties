ctrlflow_text.display_name=Трассировка алгоритмических структур (DT, 2025)
ctrlflow_text.description=Обучает основным алгоритмическим структурам императивных программ (последовательности, альтернативы и циклы) на примере задачи построения трассы выполнения заданного алгоритма

ctrlflow_text.question_prompt = <p>Нажмите на действия алгоритма в том порядке, в котором они выполнятся. Активируйте действия при помощи кнопок play  <i class="ri-play-large-fill"></i>  (начать/выполнить) и stop  <i class="ri-stop-large-fill"></i> (закончить). Вызовы подпрограмм могут иметь действия переходов <i class="ri-corner-down-right-line"></i> и <i class="ri-corner-right-up-fill"></i>, а условия <i class="ri-question-fill"></i></p>
