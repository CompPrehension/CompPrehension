ctrlflow_text.display_name=Трассировка алгоритмических структур (DT, 2025)
ctrlflow_text.description=Обучает основным алгоритмическим структурам императивных программ (последовательности, альтернативы и циклы) на примере задачи построения трассы выполнения заданного алгоритма

ctrlflow_text.question_prompt = <p>Нажмите на действия алгоритма в том порядке, в котором они выполнятся. Активируйте действия при помощи кнопок play  <i class="ri-play-large-fill"></i>  (начать/выполнить) и stop  <i class="ri-stop-large-fill"></i> (закончить). Вызовы подпрограмм могут иметь действия переходов <i class="ri-corner-down-right-line"></i> и <i class="ri-corner-right-up-fill"></i>, а условия <i class="ri-question-fill"></i></p>

ctrlflow_text.trace.evaluated=вычислилось
ctrlflow_text.trace.evaluated.he=вычислился
ctrlflow_text.trace.evaluated.she=вычислилась

ctrlflow_text.trace.executed=выполнилось
ctrlflow_text.trace.executed.he=выполнился
ctrlflow_text.trace.executed.she=выполнилась

ctrlflow_text.trace.began=началось
ctrlflow_text.trace.began.he=начался
ctrlflow_text.trace.began.she=началась

ctrlflow_text.trace.ended=завершилось
ctrlflow_text.trace.ended.he=завершился
ctrlflow_text.trace.ended.she=завершилась

ctrlflow_text.trace.began_program=начала свое выполнение
ctrlflow_text.trace.ended_program=закончила свое выполнение

ctrlflow_text.trace.condition.true=истина
ctrlflow_text.trace.condition.false=ложь
ctrlflow_text.trace.template=${structure} ${action_state} ${nth_time} ${condition} ${runtime_extra}
ctrlflow_text.trace.template.time_text=раз
ctrlflow_text.trace.template.return_value=возвращено
ctrlflow_text.trace.template.print_value=напечатано

ctrlflow_text.skill.current_execution_point_understood = Понимать положение текущей точки выполнения
ctrlflow_text.skill.current_code_block_identified = Понимать, в каком блоке кода находится точка выполнения
ctrlflow_text.skill.action_execution_determined = Понимать, было ли выполнено действие в программе
ctrlflow_text.skill.unevaluated_conditions_between_points_found = Определять наличие невычисленных условий между двумя точками программы
ctrlflow_text.skill.transition_applicable_regardless_interruption = Понимать, что переход применим при любом состоянии прерывания
ctrlflow_text.skill.interruption_type_matched = Сопоставлять вид текущего прерывания с ожидаемым для перехода
ctrlflow_text.skill.applicable_transition_with_interruption_found = Находить применимый переход, учитывая состояние прерывания программы
ctrlflow_text.skill.action_is_condition_recognized = Понимать, что действие является условием
ctrlflow_text.skill.required_condition_value_determined = Определять необходимое значение условия для перехода
ctrlflow_text.skill.applicable_transition_with_condition_found = Находить применимый переход, учитывая значение условия
ctrlflow_text.skill.action_is_function_call_recognized = Понимать, что действие является вызовом функции
ctrlflow_text.skill.function_body_completion_determined = Понимать, завершилось ли тело функции
ctrlflow_text.skill.nearest_function_call_in_trace_found = Находить ближайший по трассе вызов функции
ctrlflow_text.skill.transition_matches_interruption_mode = Понимать, что переход соответствует текущему режиму прерывания
ctrlflow_text.skill.compound_structure_boundaries_identified = Определять начало и конец составной алгоритмической структуры
ctrlflow_text.skill.early_exit_from_compound_detected = Определять, выполняется ли досрочный выход из составных действий
ctrlflow_text.skill.multiple_compound_exit_order_understood = Понимать порядок выхода из нескольких составных действий
ctrlflow_text.skill.applicable_compound_exit_determined = Определять применимый в данной точке выполнения выход из составного действия
ctrlflow_text.skill.interruption_termination_recognized = Определять, что происходит завершение прерывания
ctrlflow_text.skill.interruption_can_be_terminated_determined = Определять, что текущее прерывание может быть завершено
