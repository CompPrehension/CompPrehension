ctrlflow_text.display_name=Control Flow tracing (DT,2025)
ctrlflow_text.description=It teaches basic control-flow structures (sequence, if/else, and loop) using the task of creating an execution trace for the given algorithm

ctrlflow_text.question_prompt = <p>Press the actions of the algorithm in the order they are evaluated. Activate actions with play <i class="ri-play-large-fill"></i> and stop <i class="ri-stop-large-fill"></i> buttons. Function calls can have step into button <i class="ri-corner-down-right-line"></i> and <i class="ri-corner-right-up-fill"></i>, conditions have <i class="ri-question-fill"></i></p>

ctrlflow_text.trace.evaluated=evaluated
ctrlflow_text.trace.executed=executed
ctrlflow_text.trace.began=began
ctrlflow_text.trace.ended=ended
ctrlflow_text.trace.condition.true=true
ctrlflow_text.trace.condition.false=false
ctrlflow_text.trace.template=${structure} is ${action_state} ${nth_time} ${condition} ${runtime_extra}
ctrlflow_text.trace.template.time_text=time
ctrlflow_text.trace.template.return_value=has returned
ctrlflow_text.trace.template.print_value=has printed

ctrlflow_text.skill.current_execution_point_understood = Understand the current execution point position
ctrlflow_text.skill.current_code_block_identified = Identify the current code block containing the execution point
ctrlflow_text.skill.action_execution_determined = Determine whether an action was executed
ctrlflow_text.skill.unevaluated_conditions_between_points_found = Find unevaluated conditions between two program points
ctrlflow_text.skill.transition_applicable_regardless_interruption = Understand that transition applies regardless of interruption state
ctrlflow_text.skill.interruption_type_matched = Match the current interruption type with the expected one
ctrlflow_text.skill.applicable_transition_with_interruption_found = Find applicable transition considering interruption state
ctrlflow_text.skill.action_is_condition_recognized = Recognize that an action is a condition
ctrlflow_text.skill.required_condition_value_determined = Determine the required condition value for transition
ctrlflow_text.skill.applicable_transition_with_condition_found = Find applicable transition considering condition value
ctrlflow_text.skill.action_is_function_call_recognized = Recognize that an action is a function call
ctrlflow_text.skill.function_body_completion_determined = Determine whether the function body has completed
ctrlflow_text.skill.nearest_function_call_in_trace_found = Find the nearest function call in the trace
ctrlflow_text.skill.transition_matches_interruption_mode = Understand that transition matches the current interruption mode
ctrlflow_text.skill.compound_structure_boundaries_identified = Identify the beginning and end of a compound structure
ctrlflow_text.skill.early_exit_from_compound_detected = Detect early exit from compound actions
ctrlflow_text.skill.multiple_compound_exit_order_understood = Understand the order of exiting multiple compound actions
ctrlflow_text.skill.applicable_compound_exit_determined = Determine the applicable compound action exit at the current execution point
ctrlflow_text.skill.interruption_termination_recognized = Recognize that interruption is being terminated
ctrlflow_text.skill.interruption_can_be_terminated_determined = Determine that the current interruption can be terminated
