ctrlflow_text.display_name=Control Flow tracing (DT,2025)
ctrlflow_text.description=It teaches basic control-flow structures (sequence, if/else, and loop) using the task of creating an execution trace for the given algorithm

ctrlflow_text.question_prompt = <p>Press the actions of the algorithm in the order they are evaluated. Activate actions with play <i class="ri-play-large-fill"></i> and stop <i class="ri-stop-large-fill"></i> buttons. Function calls can have step into button <i class="ri-corner-down-right-line"></i> and <i class="ri-corner-right-up-fill"></i>, conditions have <i class="ri-question-fill"></i></p>

ctrlflow_text.trace.evaluated=evaluated
ctrlflow_text.trace.executed=executed
ctrlflow_text.trace.began=began
ctrlflow_text.trace.ended=ended
ctrlflow_text.trace.condition.true=true
ctrlflow_text.trace.condition.false=false
ctrlflow_text.trace.template=${structure} is ${action_state} ${nth_time} ${condition} ${runtime_extra}
ctrlflow_text.trace.template.time_text=time
ctrlflow_text.trace.template.return_value=has returned
ctrlflow_text.trace.template.print_value=has printed