typeeval_text.display_name=Expression types (DT)
typeeval_text.description=Teaches to determine the result type of every part of an expression from the types and values of its operands

typeeval_text.question_prompt=<p>The program has stopped at the marked place. Choose the result type of every part of the expression, starting from the innermost ones: click the label above a part. If a part causes an error, choose the error.</p>
typeeval_text.operands_first=First determine the types of the operands of this part of the expression: its type depends on them.
typeeval_text.trace.template=<code>${expression}</code> evaluated: type <code>${type}</code>
typeeval_text.trace.template.value=<code>${expression}</code> evaluated: value <code>${value}</code>, type <code>${type}</code>
typeeval_text.trace.template.error=<code>${expression}</code> evaluated: error <code>${type}</code>

