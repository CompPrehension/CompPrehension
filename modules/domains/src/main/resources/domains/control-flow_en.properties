ctrlflow_text.display_name_dt=Control Flow tracing (DT,2025)
ctrlflow_text.description=It teaches basic control-flow structures (sequence, if/else, and loop) using the task of creating an execution trace for the given algorithm

ctrlflow_text.question_prompt = <p>Press the action buttons in the order the actions are executed. <i class="ri-play-fill"></i> executes a statement or starts a block, <i class="ri-stop-fill"></i> finishes a block, <i class="ri-question-fill"></i> evaluates a condition or takes the next item of a for-each loop, <i class="ri-corner-down-right-line"></i> steps into a function call, and <i class="ri-corner-right-down-fill"></i> returns from it; if the function was called several times, choose in the list which call is ending.</p>

ctrlflow_text.trace.executed=executed
ctrlflow_text.trace.began=started
ctrlflow_text.trace.ended=finished
ctrlflow_text.trace.condition.true=true
ctrlflow_text.trace.condition.false=false
ctrlflow_text.trace.template=${structure} ${action_state} for the ${nth_time} time${value}

ctrlflow_text.skill.interruption_exits_constructs = Understand that break, continue and return exit the enclosing constructs early
ctrlflow_text.skill.condition_value_selects_next = Choose the next action by the value of a condition
ctrlflow_text.skill.construct_entered_before_inner = Understand that a construct begins before the actions inside it
ctrlflow_text.skill.inner_construct_finished_before_next = Finish a nested construct before moving on to the next action
ctrlflow_text.skill.passed_action_repeat = Understand when an already executed action can be executed again
ctrlflow_text.skill.containing_action_before_inner = Understand that nested actions run only while the part containing them runs
ctrlflow_text.skill.alternative_single_branch = Understand that only one branch of an alternative is executed
ctrlflow_text.skill.alternative_conditions_in_order = Check the conditions of an alternative in order
ctrlflow_text.skill.actions_in_order = Execute the actions of a sequence in order
ctrlflow_text.skill.no_early_exit_without_interruption = Understand that a construct is not exited early without break, continue or return
ctrlflow_text.skill.everything_evaluated = Program completed
ctrlflow_text.skill.function_body_runs_on_call = Understand that a function body is executed when the function is called
ctrlflow_text.skill.function_not_resumed_after_exit = Understand that a finished function call does not resume
ctrlflow_text.skill.call_return_matches_activation = Return from function calls in the reverse order of their start

