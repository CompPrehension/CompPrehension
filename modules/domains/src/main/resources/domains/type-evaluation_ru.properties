typeeval_text.display_name=Типы выражений (DT)
typeeval_text.description=Обучает определять тип результата каждой части выражения по типам и значениям операндов

typeeval_text.question_prompt=<p>Выполнение программы остановлено в отмеченном месте. Выберите тип результата каждой части выражения, начиная с самых внутренних: нажмите на подпись над частью. Если часть вызовет ошибку, выберите ошибку.</p>
typeeval_text.operands_first=Сначала определите типы операндов этой части выражения: её тип зависит от них.
typeeval_text.trace.template=<code>${expression}</code> вычислено: тип <code>${type}</code>
typeeval_text.trace.template.value=<code>${expression}</code> вычислено: значение <code>${value}</code>, тип <code>${type}</code>
typeeval_text.trace.template.error=<code>${expression}</code> вычислено: ошибка <code>${type}</code>

typeeval_text.skill.true_division_result=Определять тип результата деления
typeeval_text.skill.numeric_result_type=Определять тип результата арифметики над числами
typeeval_text.skill.sequence_operation_applicability=Понимать, какие арифметические операции применимы к последовательностям
typeeval_text.skill.negation_result=Определять тип результата логического отрицания
typeeval_text.skill.boolean_logical_result=Определять тип результата логических операций, дающих логическое значение
typeeval_text.skill.logical_returned_operand=Определять, какой операнд возвращают and и or
typeeval_text.skill.equality_comparison=Определять тип результата проверки на равенство
typeeval_text.skill.ordering_comparison=Понимать, какие значения можно сравнивать по порядку
typeeval_text.skill.membership_test=Понимать, где можно проверить вхождение
typeeval_text.skill.mapping_value_access=Определять тип значения, получаемого из словаря по ключу
typeeval_text.skill.indexing_applicability=Понимать, к чему применимо обращение по индексу
typeeval_text.skill.indexed_element_type=Определять тип элемента, получаемого по индексу
typeeval_text.skill.slice_result=Определять тип результата среза
typeeval_text.skill.call_fixed_result=Определять тип результата встроенной функции
typeeval_text.skill.length_applicability=Понимать, у каких значений есть длина
typeeval_text.skill.conversion_applicability=Понимать, какие значения преобразуются в число
typeeval_text.skill.operand_identification=Соотносить операнд с переменной из условия
typeeval_text.skill.field_access=Определять, что даёт обращение к полю
typeeval_text.skill.object_construction=Понимать, что возвращает вызов класса
typeeval_text.skill.method_call=Определять, что возвращает вызов метода
typeeval_text.skill.member_lookup=Находить член у типа с учётом родительских классов
typeeval_text.skill.member_visibility=Понимать, откуда доступен закрытый или защищённый член
typeeval_text.skill.static_member_access=Различать обращение к члену через класс и через объект
typeeval_text.skill.error_kind=Различать виды ошибок
typeeval_text.skill.operator_identification=Различать похожие операторы
typeeval_text.skill.language_semantics_transfer=Не переносить правила операций из других языков

