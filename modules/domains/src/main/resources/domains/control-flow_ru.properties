ctrlflow_text.display_name_dt=Трассировка алгоритмических структур (DT, 2025)
ctrlflow_text.description=Обучает основным алгоритмическим структурам императивных программ (последовательности, альтернативы и циклы) на примере задачи построения трассы выполнения заданного алгоритма

ctrlflow_text.question_prompt = <p>Нажимайте кнопки действий в том порядке, в котором они выполнятся. <i class="ri-play-fill"></i> выполняет оператор или начинает блок, <i class="ri-stop-fill"></i> заканчивает блок, <i class="ri-question-fill"></i> вычисляет условие или берёт очередной элемент цикла «для каждого», <i class="ri-corner-down-right-line"></i> входит в вызов функции, а <i class="ri-corner-right-down-fill"></i> возвращается из него; если функция вызывалась несколько раз, выберите в списке, какой вызов завершается.</p>

ctrlflow_text.trace.executed=выполнилось
ctrlflow_text.trace.executed.he=выполнился
ctrlflow_text.trace.executed.she=выполнилась

ctrlflow_text.trace.began=начало выполняться
ctrlflow_text.trace.began.he=начал выполняться
ctrlflow_text.trace.began.she=начала выполняться

ctrlflow_text.trace.ended=завершило выполнение
ctrlflow_text.trace.ended.he=завершил выполнение
ctrlflow_text.trace.ended.she=завершила выполнение

ctrlflow_text.trace.condition.true=истина
ctrlflow_text.trace.condition.false=ложь
ctrlflow_text.trace.template=${structure} ${action_state} ${nth_time} раз${value}

ctrlflow_text.skill.interruption_exits_constructs = Понимать, что break, continue и return досрочно завершают охватывающие конструкции
ctrlflow_text.skill.condition_value_selects_next = Выбирать следующее действие по значению условия
ctrlflow_text.skill.construct_entered_before_inner = Понимать, что конструкция начинается раньше вложенных в неё действий
ctrlflow_text.skill.inner_construct_finished_before_next = Завершать вложенную конструкцию, прежде чем переходить к следующему действию
ctrlflow_text.skill.passed_action_repeat = Понимать, когда уже выполненное действие может выполниться снова
ctrlflow_text.skill.containing_action_before_inner = Понимать, что вложенные действия выполняются только во время выполнения содержащей их части
ctrlflow_text.skill.alternative_single_branch = Понимать, что в развилке выполняется только одна ветка
ctrlflow_text.skill.alternative_conditions_in_order = Проверять условия развилки по порядку
ctrlflow_text.skill.actions_in_order = Выполнять действия следования по порядку
ctrlflow_text.skill.no_early_exit_without_interruption = Понимать, что без break, continue или return досрочного выхода из конструкции не бывает
ctrlflow_text.skill.everything_evaluated = Программа завершена
ctrlflow_text.skill.function_body_runs_on_call = Понимать, что тело функции выполняется при её вызове
ctrlflow_text.skill.function_not_resumed_after_exit = Понимать, что завершившийся вызов функции не продолжается
ctrlflow_text.skill.call_return_matches_activation = Завершать вызовы функций в порядке, обратном их началу

