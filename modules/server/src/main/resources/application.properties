#############################################################################################################
# Domain settings
#############################################################################################################

# lti config
config.property.lti_launch_key=lti-test-launch-key
config.property.lti_launch_secret=GenerateRandomStringHere

# backend concurrency config
config.property.backendsPoolSize=4
config.property.backendsQueueSize=30

# db logging config
config.property.db-logging.enabled=false
config.property.db-logging.level=INFO
spring.application.name=compph-site

# server concurrency config
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=2MB

# bkt config
bkt.enabled=true
bkt.host=localhost
bkt.port=50051

#############################################################################################################
# Site settings
#############################################################################################################

# hybernate settings
#spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
#spring.jpa.show-sql=true
#spring.jpa.generate-ddl=true
#spring.jpa.properties.hibernate.generate_statistics=true

spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/static/

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/test_db?useSSL=false\
    &allowPublicKeyRetrieval=true\
    &rewriteBatchedStatements=true\
    &useUnicode=yes\
    &characterEncoding=UTF-8\
    &useJDBCCompliantTimezoneShift=true\
    &useLegacyDatetimeCode=false\
    &serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root1234
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.main.allow-bean-definition-overriding=true

server.port=8433
# Plain HTTP port for server-to-server calls (e.g. Moodle fetching JWKS in dev Docker setup).
# Set to -1 or remove in production (use HTTPS only).
server.http.port=8090
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore/springboot.p12
server.ssl.key-store-password=password
server.ssl.key-alias=springboot
server.ssl.key-password=password
server.ssl.enabled=true


# ---- Keycloak OIDC (direct access, IdP hub) ----
# Keycloak can broker any external provider (LDAP, Moodle OIDC, etc.) without changes here.
# Client in Keycloak must have Protocol Mapper: Group Membership → claim "groups" → add to ID token.
# Local dev: http://localhost:8080/realms/compph  (docker-compose keycloak service)
# Production: https://auth.compprehension.ru/realms/compph
spring.security.oauth2.client.registration.keycloak.client-id=compph-dev
spring.security.oauth2.client.registration.keycloak.client-secret=MjA3cmoE4MgrSCMvp6Wu55pU22WVgvUS
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/compph

# ---- LTI 1.3 AGS grade passback ----
# Client ID registered in Moodle: Admin → LTI → External Tools → [tool] → Client ID
lti.client-id=DTVu9GNzkBcXMx5
# RSA private key in PKCS8 DER format, base64-encoded. Generate with:
#   openssl genrsa -out lti_private.pem 2048
#   openssl pkcs8 -topk8 -nocrypt -in lti_private.pem -outform DER | base64 -w0 > lti_private_pkcs8.b64
# Register the corresponding lti_public.pem in Moodle's LTI tool Public key field.
lti.private-key-pkcs8-

# ---- Moodle Web Services (grade passback for Keycloak users) ----
# TECH DEBT: wstoken is a long-lived admin token stored in config.
# In production replace with a service account having only the required capabilities:
# core_user_get_users_by_field, core_enrol_get_users_courses,
# mod_lti_get_ltis_by_courses, core_grades_update_grades.
# Create token: Moodle Admin -> Server -> Web services -> Manage tokens -> Create token
moodle.base-url=http://localhost:8081
moodle.webservice-token=c0b1ac1227be9aacb5a5ca51c0e4a083

# Enable response compression
server.compression.enabled=true
# The comma-separated list of mime types that should be compressed
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
# Compress the response only if the response size is at least 1KB
server.compression.min-response-size=1024

server.servlet.session.timeout=5h
spring.session.timeout=5h

# for correct LTI work (allow cookie authentication for cross-domain requests)
server.servlet.session.cookie.same-site=none
