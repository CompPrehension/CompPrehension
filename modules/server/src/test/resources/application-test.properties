# all basic settings are located in server application.properties
# this file contains only test-specific overrides

MYSQL_DATABASE=compph_test

spring.liquibase.enabled=true
spring.sql.init.mode=always

bkt.enabled=false
config.property.db-logging.enabled=false
# tests process the outbox themselves via OutboxProcessor
compprehension.outbox.processing-enabled=false
server.ssl.enabled=false

spring.security.oauth2.client.registration.keycloak.client-id=integration-test
spring.security.oauth2.client.registration.keycloak.client-secret=integration-test

# the private key of the test LMS (registered in data.sql) signs test id_tokens
test.lti.platform-private-key-pkcs8-
# tool key and public address
compprehension.lti.tool-base-url=https://tool.test
compprehension.lti.tool-private-key-pkcs8-
