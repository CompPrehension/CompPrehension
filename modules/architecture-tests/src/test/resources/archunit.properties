# --- Baseline существующих нарушений -------------------------------------------------
# Правила обёрнуты в FreezingArchRule: при первом запуске ArchUnit записывает все
# текущие нарушения в каталог archunit-violations и дальше падает только на НОВЫХ.
# Когда нарушение чинят, оно автоматически вычёркивается из baseline и вернуться
# уже не может. Каталог archunit-violations коммитится в git — это и есть список
# техдолга по слоям, который должен только уменьшаться.
freeze.store.default.path=archunit-violations

# Разрешаем создать baseline на пустом месте. После первого коммита baseline
# значение можно поменять на false, чтобы новое правило нельзя было
# «заморозить» молча — его придётся заводить осознанно.
freeze.store.default.allowStoreCreation=true

# true перезапишет baseline текущим состоянием кода. Никогда не оставляйте true
# в коммите: это стирает весь накопленный техдолг одним движением.
freeze.refreeze=false

# Классы читаются из target/classes модулей (см. ProjectClassesLocationProvider), поэтому
# сам Spring в импорт не попадает. Чтобы правила вида areAssignableTo(Repository.class)
# видели иерархию JpaRepository, недостающие типы дорезолвливаются с classpath.
resolveMissingDependenciesFromClassPath=true
